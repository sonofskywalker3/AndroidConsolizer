name: Publish to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v3.5.0). Leave empty for latest release.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: manifest.json
          sparse-checkout-cone-mode: false

      - name: Determine release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh release view --json tagName -q '.tagName')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Strip leading 'v' for version string
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download release asset
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern '*.zip' \
            --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find ZIP file
        id: zip
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "path=$ZIP" >> $GITHUB_OUTPUT
          echo "Found: $ZIP"

      - name: Upload to Nexus Mods
        # Pinned to the v3-migration merge (post-migration main as of 2026-07-13).
        # The v3 mod-file id equals our old file_group_id — verified via TLY's
        # read-only nexus-v3-probe workflow (GET /v3/mods/5596342428557/files:
        # 7118491 is this mod's single ACTIVE file; legacy per-version fileIds 404).
        # Rollback if a release fails: pre-migration pin
        # ee1af4be8e1be6773ab5aeb02bacc6d638b20deb with the old
        # file_group_id/file_category/archive_existing_file inputs (until 2026-09-09).
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          # v3 mod-file id (NOT mod ID, NOT a per-version fileId). Stays stable
          # across version updates; new versions attach to it.
          file_id: 7118491
          filename: ${{ steps.zip.outputs.path }}
          version: ${{ steps.release.outputs.version }}
          category: main
          archive_existing_version: true
